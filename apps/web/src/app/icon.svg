<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant Cyber-Pink and Neon Cyan Gradient for the Gel Heart -->
    <linearGradient id="neonHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1493" /> <!-- Hot Pink -->
      <stop offset="50%" stop-color="#8a2be2" /> <!-- Purple -->
      <stop offset="100%" stop-color="#00ffff" /> <!-- Electric Cyan -->
    </linearGradient>

    <!-- Metallic Liquid Chrome Gradient for the Starburst -->
    <linearGradient id="chromeStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e0e0e0" />
      <stop offset="40%" stop-color="#555555" />
      <stop offset="45%" stop-color="#222222" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#888888" />
      <stop offset="80%" stop-color="#dcdcdc" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>

    <!-- Neon Glow Drop Shadow -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Liquid Gel Specular Shine Overlay -->
    <linearGradient id="gelShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Glow Ring (Subtle) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.3" filter="url(#cyberGlow)" />

  <!-- 1. The Core 3D Cyber Heart -->
  <g filter="url(#cyberGlow)">
    <!-- Heart Base path scaled for 100x100 viewport -->
    <path d="M 50,28 C 38,13 13,13 13,44 C 13,68 50,88 50,88 C 50,88 87,68 87,44 C 87,13 62,13 50,28 Z" 
          fill="url(#neonHeart)" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-linecap="round" />
          
    <!-- Semi-transparent Glossy Gel Highlight (Creates the 3D rounded glass sphere look) -->
    <path d="M 50,30 C 40,17 20,17 19,42 C 18,52 30,62 50,78 C 70,62 82,52 81,42 C 80,17 60,17 50,30 Z" 
          fill="url(#gelShine)" 
          mask="url(#heartMask)" />
  </g>

  <!-- 2. The Futuristic Metallic Y2K Chrome Starburst -->
  <!-- Mathematical quadratic curve star flared symmetrically -->
  <path d="M 50,15 Q 50,50 15,50 Q 50,50 50,85 Q 50,50 85,50 Q 50,50 50,15 Z" 
        fill="url(#chromeStar)" 
        stroke="#ffffff" 
        stroke-width="1" 
        filter="url(#cyberGlow)" />

  <!-- Chrome star center glint -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" filter="url(#cyberGlow)" />

  <!-- 3. Dynamic Sparkle Elements -->
  <!-- Small Star Top Right -->
  <path d="M 76,26 Q 76,32 70,32 Q 76,32 76,38 Q 76,32 82,32 Q 76,32 76,26 Z" fill="#ffffff" />
  
  <!-- Small Star Bottom Left -->
  <path d="M 24,68 Q 24,74 18,74 Q 24,74 24,80 Q 24,74 30,74 Q 24,74 24,68 Z" fill="#00ffff" filter="url(#cyberGlow)" />

  <!-- Cyber Glint Dot -->
  <circle cx="28" cy="28" r="1.5" fill="#ffffff" />
  <circle cx="72" cy="72" r="1.5" fill="#ffffff" />
</svg>
